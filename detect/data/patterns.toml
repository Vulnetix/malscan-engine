id = "P-CARGO-BUILD-DOWNLOAD"
file_exts = [".rs"]
ecosystems = ["cargo"]
# The second branch used to be a bare `https?://...\.(sh|ps1|exe|bin)`, which has
# nothing to do with Rust or build.rs. Pattern rules carry no ecosystem filter, so
# every rule runs against every ecosystem's content: that branch matched any
# npm packument mentioning a URL ending in .sh or .exe and 423'd chalk, eslint,
# cors, pg, socket.io, node-fetch, cross-env, yargs, inquirer, fs-extra, js-yaml,
# moment, ramda and immer as "build.rs downloads a remote resource at build time".
# Restricted to the Rust HTTP clients this rule is actually about. A generic
# download-an-executable detector is worth having, but as its own id, and it needs
# the ecosystem gating the rule schema does not yet support.
pattern = '(reqwest|ureq|hyper|isahc)::[^\n]{0,40}(get|post)\s*\('
points = 45
description = "build.rs downloads a remote resource at build time"
override_gate = false
# A weakness (CWE-494, download of code without an integrity check), not evidence: build scripts fetch
# protoc, prebuilt native libraries and test data as a matter of course. What is DONE with the download is
# judged by the execute and decode rules. 20 live cargo advisories rested on this alone.
weakness = true
cwe = "CWE-494"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

[[pkgbuild_analysis]]
