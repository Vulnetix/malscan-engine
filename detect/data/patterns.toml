cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"
[[install_script_analysis]]
id = "JL-DOWNLOAD-EXEC"
pattern = '(Base\.)?download\([^)]{0,120}\)[\s\S]{0,200}(include|evalfile|eval)\b'
points = 55
description = "build.jl downloads a remote artefact and include/eval-executes it"
override_gate = true
[[pkgbuild_analysis]]
id = "JL-BASE64-INCLUDE-STRING"
pattern = 'base64decode\([\s\S]{0,120}(include_string|Meta\.parse|eval)\b'
points = 50
description = "base64-decoded payload fed to include_string/eval (obfuscated execution)"
override_gate = true

# --- Conan (Python recipe; generic P-PY-* rules also apply) ---
[[install_script_analysis]]
id = "P-CONAN-SELF-RUN-SHELL"
pattern = 'self\.run\s*\(\s*f?["\x27](curl|wget|bash|sh |chmod|nc |powershell|certutil)'
points = 50
description = "conanfile self.run() executing a shell/download command at build time"
override_gate = true
[[install_script_analysis]]
