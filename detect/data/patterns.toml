# --- Reverse Shells via interpreters not covered elsewhere ---

[[gtfobins_analysis]]
id = "G-REVSHELL-NODE"
# `.*` spanned whole minified bundles (a CDP relay source string matched; 2026-10 audit). Spans are
# now bounded to one line and a few hundred characters. A bare `require('net').connect(port, host)`
# still fires: the hook-context tests treat it as an outbound socket from runtime source.
pattern = '''\bnode[ \t]+(-e|--eval)[ \t][^\n]{0,200}?\bnet\b[^\n]{0,200}?\bSocket\b|require\s*\(\s*['"](?:net|child_process)['"]\s*\)[^\n]{0,200}?\bconnect\b'''
points = 85
description = "Node.js reverse shell (net.Socket connect)"
override_gate = true

[[gtfobins_analysis]]
id = "G-REVSHELL-JULIA"
pattern = 'julia\s+.*TCPSocket|julia\s+.*Sockets\.\s*connect'
points = 85
description = "Julia reverse shell (TCPSocket)"
override_gate = true

[[gtfobins_analysis]]
id = "G-REVSHELL-TCLSH"
# "wish" is an English word and `.*` spanned whole lines (2026-10 audit). Now a Tcl `[socket ...]`
# command on the same line as tclsh/wish, either order, bounded.
pattern = '\b(?:tclsh|wish)\b[^\n]{0,200}?\[\s*socket[ \t]|\[\s*socket[ \t][^\n]{0,300}?\|[ \t]*(?:tclsh|wish)\b'
points = 85
description = "Tcl reverse shell (socket connect)"
override_gate = true

[[gtfobins_analysis]]
