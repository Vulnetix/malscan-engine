# ---------------------------------------------------------------------------
# JavaScript / npm ecosystem rules. These scan the package's scripts block and
# (for packages declaring lifecycle hooks) the published tarball JavaScript.
# Regexes target JS-only constructs (Buffer.from/atob/require) so they do not
# fire on shell PKGBUILDs or Ruby formulae.
# ---------------------------------------------------------------------------

[[pkgbuild_analysis]]
id = "P-JS-EVAL-DECODE"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = 'eval\s*\(\s*(Buffer\.from|atob|globalThis\.atob|window\.atob)'
points = 55
description = "eval() of a base64/hex-decoded payload (dynamic code execution)"
override_gate = true

[[pkgbuild_analysis]]
id = "P-JS-NEW-FUNCTION-DECODE"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = 'new\s+Function\s*\(\s*(Buffer\.from|atob|globalThis\.atob)'
points = 52
description = "new Function() built from a base64-decoded payload (dynamic code execution)"
override_gate = true

[[pkgbuild_analysis]]
id = "P-JS-CHILDPROC-DECODE"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = '(child_process|exec|execSync|spawn|spawnSync)[^\n]{0,120}(Buffer\.from\s*\(|atob\s*\()'
points = 50
description = "child_process exec/spawn of a base64-decoded command (download-and-execute)"
override_gate = true

[[pkgbuild_analysis]]
id = "P-JS-ENV-EXFIL"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = 'JSON\.stringify\s*\(\s*process\.env'
points = 35
description = "serialises process.env (potential credential/secret exfiltration)"
override_gate = false

[[pkgbuild_analysis]]
id = "P-JS-OBFUSCATOR-SIG"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = '_0x[a-f0-9]{4,6}\s*[=\[(,]'
points = 25
description = "javascript-obfuscator-style hex identifiers (obfuscated code)"
override_gate = false

[[pkgbuild_analysis]]
id = "P-JS-DYNAMIC-REQUIRE-NET"
file_exts = [".js", ".mjs", ".cjs", ".ts", ".mts", ".cts", ".jsx", ".tsx"]
pattern = 'require\s*\(\s*(atob|Buffer\.from)'
points = 48
description = "dynamic require() of a decoded module name (obfuscated dependency load)"
override_gate = true

[[install_script_analysis]]
id = "P-NPM-HOOK-NODE-EVAL"
ecosystems = ["npm"]
pattern = 'node\s+(--eval|-e)\b'
points = 55
description = "lifecycle install hook executes inline node code (node -e/--eval)"
weakness = true
cwe = "CWE-95"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

# The hostile shape of an inline `node -e` hook: it opens a network channel AND reads the
# machine or its environment in the same script. P-NPM-HOOK-NODE-EVAL above is the
# capability (husky, `require('./scripts/postinstall')`, a version check); this is the
# beacon. Measured 2026-10-17 over every recorded P-NPM-HOOK-NODE-EVAL line in production
# (363): 21 match, and 11 of those are in packages OpenSSF independently confirmed as malware
# (52%, against about 7% for the broad rule). A localhost-only beacon with hostname/user in
# the query string is a dependency-confusion probe and is kept as malware on purpose.
[[install_script_analysis]]
id = "P-NPM-HOOK-NODE-EVAL-EXFIL"
ecosystems = ["npm"]
pattern = 'node\s+(--eval|-e)\b[^\n]*((require\(["\x27](https?|net|dgram)["\x27]\)|\bfetch\s*\()[^\n]*(os\.hostname|userInfo\(\)|npm_config_|process\.env|os\.homedir)|(os\.hostname|userInfo\(\)|npm_config_|process\.env|os\.homedir)[^\n]*(require\(["\x27](https?|net|dgram)["\x27]\)|\bfetch\s*\())'
points = 80
description = "lifecycle install hook runs inline node code that reads host/env data and opens a network channel"
override_gate = true

[[install_script_analysis]]
id = "P-NPM-HOOK-DECODE"
ecosystems = ["npm"]
pattern = '(atob|Buffer\.from)\s*\('
points = 45
description = "lifecycle install hook decodes a base64 payload"
override_gate = true

[[install_script_analysis]]
id = "P-NPM-HOOK-ENV-EXFIL"
ecosystems = ["npm"]
pattern = 'process\.env\b[^\n]{0,80}(https?://|fetch\(|\.post\(|net\.|dns\.)'
points = 50
description = "lifecycle install hook reads process.env and contacts the network (secret exfiltration)"
override_gate = true

# ---------------------------------------------------------------------------
# Python / PyPI ecosystem rules. These scan setup.py (executes at pip install
# time) and concatenated sdist sources. Regexes target Python constructs so
# they do not fire on shell PKGBUILDs or Ruby formulae.
# ---------------------------------------------------------------------------

[[install_script_analysis]]
id = "P-PY-SETUP-EXEC"
file_exts = [".py", ".pyw"]
# Context, not evidence and not a weakness. setup.py runs cmake, git, nm, gcc, `brew install`
# and its own build scripts through subprocess as a matter of course: of 25 sampled lines from
# packages minted on this rule alone, every one was a build step, and 29 of 520 packages
# carrying it (5.6%) are OpenSSF-confirmed -- almost all with other evidence. A constant argv
# is not a vulnerability either, so it is not reported as one. The hostile shapes are separate
# rules (P-PY-SETUP-EVAL-DECODE, P-INSTALL-CURL, P-PY-SETUP-HOST-RECON).
pattern = '(os\.system|subprocess\.(Popen|call|run|check_output|check_call))\s*\('
points = 25
description = "setup.py spawns a subprocess at install time (build step; corroboration only)"
override_gate = false

[[install_script_analysis]]
id = "P-PY-SETUP-HOST-RECON"
file_exts = [".py", ".pyw"]
ecosystems = ["pypi"]
# setup.py asks the machine who and where it is. A build never needs the hostname or the
# user name; an install-time beacon does. Measured 2026-10-18 over the stored P-PY-SETUP-EXEC
# lines: 2 packages match and both are OpenSSF-confirmed.
pattern = '(check_output|run|Popen|call|check_call)\s*\(\s*\[\s*["\x27](hostname|whoami)["\x27]'
points = 60
description = "setup.py runs hostname/whoami at install time (host fingerprinting)"
override_gate = true

[[install_script_analysis]]
id = "P-PY-SETUP-EVAL-DECODE"
file_exts = [".py", ".pyw"]
pattern = '(exec|eval)\s*\(\s*(base64\.b64decode|bytes\.fromhex|__import__\(.{0,30}base64)'
points = 55
description = "setup.py exec/eval of a base64/hex-decoded payload (dynamic code execution)"
override_gate = true

[[install_script_analysis]]
id = "P-PY-SETUP-URLLIB"
file_exts = [".py", ".pyw"]
pattern = '(urllib\.request\.urlopen|urllib\.urlopen|requests\.get|urlretrieve)\s*\('
points = 40
description = "setup.py downloads from the network at install time"
override_gate = false

[[pkgbuild_analysis]]
id = "P-PY-EXEC-DECODE"
file_exts = [".py", ".pyw"]
pattern = '(exec|eval)\s*\(\s*(base64\.b64decode|bytes\.fromhex|codecs\.decode|marshal\.loads|zlib\.decompress)'
points = 55
description = "exec/eval of a decoded/decompressed payload (dynamic code execution)"
override_gate = true

[[pkgbuild_analysis]]
id = "P-PY-COMPILE-EXEC"
file_exts = [".py", ".pyw"]
pattern = 'exec\s*\(\s*compile\s*\('
points = 48
description = "exec(compile(...)) dynamic code execution"
weakness = true
cwe = "CWE-94"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

# The hostile shape of the same call: what is compiled is DECODED, fetched or carries an
# obfuscator's identifier. P-PY-COMPILE-EXEC above is the capability (a plugin loader, a
# notebook runner, a test harness); this is the intent. Measured 2026-10-17 against every
# recorded P-PY-COMPILE-EXEC line in production (622 distinct): 7 match, all of them
# base64/bytes-decoded payloads or `_0x...` names. Against OpenSSF malicious-packages, the
# 10 confirmed PyPI packages whose mint carried P-PY-COMPILE-EXEC include `_HOOK.decode()`
# (fastapii, flasq, idnna, pydanticc), `base64.b64decode(ENCODED)` (flask-header-guard) and
# `_0x667f` (ig-gox) - this rule keeps those as malware while the broad rule above stops
# naming every plugin loader.
[[pkgbuild_analysis]]
id = "P-PY-COMPILE-EXEC-DECODED"
file_exts = [".py", ".pyw"]
pattern = 'exec\s*\(\s*compile\s*\([^\n]{0,160}(\.decode\s*\(|b64decode|fromhex|unhexlify|decompress|marshal\.loads|urlopen|requests\.get|_0x[0-9a-f]{3,})'
points = 80
description = "exec(compile(...)) of a decoded, fetched or obfuscated payload"
override_gate = true

[[pkgbuild_analysis]]
id = "P-PY-DYNAMIC-IMPORT-DECODE"
file_exts = [".py", ".pyw"]
pattern = '__import__\s*\(\s*(base64\.b64decode|bytes\.fromhex)'
points = 50
description = "__import__ of a decoded module name (obfuscated import)"
override_gate = true

[[pkgbuild_analysis]]
id = "P-PY-ENV-EXFIL"
file_exts = [".py", ".pyw"]
pattern = '(os\.environ|getpass|platform\.node\(\))[^\n]{0,80}(requests\.(post|get)|urlopen|socket\.|httpx\.)'
points = 35
description = "reads environment/host info and contacts the network (recon/exfil)"
override_gate = false

