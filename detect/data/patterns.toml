[[pkgbuild_analysis]]
id = "P-CLIPBOARD-READ"
# Reads only. The bare tool name matched writes (`xclip -selection clipboard` reads stdin INTO the
# clipboard; `xsel --clipboard --input`, wl-copy, pbcopy) and prose ("requires xclip or xsel",
# "Copy using wl-copy / xclip / xsel"): the 2026-10 audit found 152 of 171 withdrawn lines firing.
# The rule now needs an output mode: `xclip ... -o`/`-out`, `xsel` with `-o`/`--output` or with
# only selection flags at the end of a command, or wl-paste/pbpaste at command position (after a
# quote, `(`, `|`, `;`, `&` or `=`). Replay: withdrawn 152 -> 19; the 3 verified-malware lines
# (a docstring and two prose lines naming the tools) are lost.
pattern = '\bxclip\b[^|;&\n]*?\s-o(?:ut)?\b|\bxsel(?:\s+(?:-[bpsk]+|--(?:clipboard|primary|secondary)))*\s+(?:-[bpsk]*o[bpsk]*|--output)\b|(?:^|["\x27`(|;&=])\s*xsel(?:\s+(?:-[bpsk]+|--(?:clipboard|primary|secondary)))*\s*(?:$|[)|;&`]|["\x27]\s*\))|(?:^|["\x27`(|;&=])\s*(?:wl-paste|pbpaste)\b'
points = 50
description = "Clipboard access (possible credential theft)"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

