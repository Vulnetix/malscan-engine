[[pkgbuild_analysis]]
id = "P-REVSHELL-PYTHON"
# `.*` ran across a whole minified line, and the bare words matched audit-hook tables
# (`('socket.connect', ..., 'subprocess.Popen')`), `patch("socket.create_connection", ...)` mocks
# and prose (2026-10 audit). Now: a socket, then a `connect(` call within 200 characters, then a
# subprocess call, os.dup2 or pty.spawn within 400. Replay: withdrawn 6 -> 3 (reverse-shell test
# vectors); verified-malware lines 7 -> 7.
pattern = 'socket\.[^\n]{0,200}?\bconnect\s*\([^\n]{0,400}?(?:subprocess\.\w+\s*\(|os\.dup2\s*\(|pty\.spawn\s*\()'
points = 85
description = "Python reverse shell pattern"
override_gate = true

[[pkgbuild_analysis]]
id = "P-EVAL-BASE64"
# `eval` must be CALLED, not merely precede the word base64: the optional-paren form matched
# "the eval-binding ROOT COMMITMENT (receipt.root_b64, a non-empty base64 string)" in a docstring.
# A call is `eval(`, `eval $(`, eval "..." or eval `...`; the other direction is `| eval`.
pattern = '\beval\s*[\(\$"\x27\x60][^\n]{0,100}base64|base64[^\n]{0,100}(?:\|\s*(?:sudo\s+)?eval\b|\beval\s*\()'
points = 85
description = "Base64-decoded payload executed via eval"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub", "npm"]

