[[install_script_analysis]]
id = "P-INSTALL-PERSISTENCE"
# `systemctl enable` is gone from this rule: a package that ships a service enables it
# (post_install() { systemctl enable --now foo.service }), and 211 AUR advisories rested on echoed
# hints and a package enabling its own unit. Cron persistence is what remains; a hostile unit is
# P-SYSTEMD-CREATE's.
# The bare word also matched mix.exs `{:crontab, "~> 1.1"}` dependencies and `crontab -l` reads
# (2026-10 audit). It now uses P-CRON-CREATE's command shape. Regex alone over the audited lines:
# withdrawn 211 -> 0 (most of the 211 were already-fixed `systemctl enable` lines); the one
# verified-malware line, `subprocess.check_output(['crontab','-l'])`, still fires.
pattern = '[\s)]\|\s*(?:sudo\s+)?crontab(?:\s|$|["\x27`])|(?:^|[^\w./-])crontab\s+(?:-u\s+\S+\s+)?(?:-(?:[^\w\s]|$)|-\s*["\x27`)|;&]|-[rl]\b|<|[/.~$][\w$~{}./-]+|[\w-]+\.(?:txt|cron|tab|tmp|conf)\b)|["\x27]crontab["\x27]\s*,\s*(?:["\x27]-u["\x27]\s*,\s*[^,]+,\s*)?["\x27](?:-|-[rl]|[^"\x27\s]*[/.$][^"\x27]*)["\x27]|["\x27]crontab["\x27]\s*,\s*[A-Za-z_][\w.]*\s*[\]),]|\b(?:cat|ls|head|tail|less|grep)\s[^|;&\n]{0,40}?/(?:etc/cron|var/spool/cron)|(?:(?:^|[^=-])>>?|\btee(?:\s+-a)?)\s*["\x27]?/(?:etc/cron(?:\.d/|tab\b|\.(?:hourly|daily|weekly|monthly)/)|var/spool/cron)|\b(?:cp|mv|install|ln)\s[^|;&\n]{0,200}?/(?:etc/cron|var/spool/cron)|\b(?:WriteFile|writeFile|writeFileSync|appendFile|appendFileSync|write_text|file_put_contents|write_file)\s*\(\s*["\x27`]?/(?:etc/cron|var/spool/cron)|\bopen\s*\(\s*["\x27]/(?:etc/cron|var/spool/cron)[^"\x27]*["\x27]\s*,\s*["\x27]?[wa]'
points = 45
description = "Cron persistence in install script"
override_gate = false

