# Dual-use: evidence only in an auto-exec hook/PKGBUILD; context in a manually-run
# manifest script. Lifecycle hooks are scanned separately as InstallScriptContent.
hook_only = true

# Process backgrounding/hiding
[[pkgbuild_analysis]]
id = "P-NOHUP-BACKGROUND"
# Starting a daemon with nohup is ordinary (`nohup ollama serve > /tmp/x.log 2>&1 &`), and the old
# `.*&` also took the `&` of `2>&1`. The 2026-10 audit found 258 of 275 withdrawn lines firing on
# dev servers, sandbox launchers and agent docs. The nohup body now needs a network or payload
# sign (curl/wget/nc/socat/telnet, base64, /dev/tcp, `sh -i`, a URL, `python -c`, `perl -e`, a miner,
# or a program run from /tmp, /var/tmp or /dev/shm), then a backgrounding `&` that is not part of
# `>&`, `&&` or `&>`. Replay: withdrawn 258 -> 8; verified-malware lines 5 -> 2 (the 3 lost start
# Xorg, steam and the package's own binary, not the payload).
pattern = '\bnohup\s(?:[^\n]*?(?:\b(?:curl|wget|nc|ncat|socat|telnet)\s|base64|/dev/(?:tcp|udp)/|\b(?:ba)?sh\s+-i\b|https?://|python[23]?\s+-c|perl\s+-e|\bxmrig)|(?:[^\s>]\S*\s+){0,3}["\x27]?/(?:tmp|dev/shm|var/tmp)/)[^\n]*[^>&]&(?:[^&>]|$)'
points = 55
description = "nohup with backgrounding (persistent hidden process)"
override_gate = false
# hook_only on the registries where it was measured as noise: pypi 3 of 126 packages carrying it are
# OpenSSF-confirmed. npm keeps it (11 of 44).
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

[[pkgbuild_analysis]]
id = "P-DEVNULL-BACKGROUND"
# `.*&` took the `&` of `2>&1` or `&&`, so every `command -v curl >/dev/null 2>&1 && ...` presence
# probe and `curl -sf http://127.0.0.1:8000/health >/dev/null && break` health poll matched (the
# 2026-10 audit: 296 of 324 withdrawn lines fired). The `&` must now background: not part of `>&`,
# `&&` or `&>`, on the same line, and the command is a whole word. Replay: withdrawn 296 -> 46; the
# one verified-malware line (`sudo tee /etc/profile.d/x >/dev/null && sudo chmod +x`) backgrounds
# nothing and is lost.
pattern = '\b(?:curl|wget|python[23]?|bash|sh)\s[^\n]*>\s*/dev/null[^\n]*[^>&]&(?:[^&>]|$)'
points = 65
description = "Network/shell command backgrounded with suppressed output"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

# System reconnaissance
[[pkgbuild_analysis]]
id = "P-SYSINFO-RECON"
# `\bip\s+addr` matched the English phrase "ip address", because "addr" is a prefix
# of "address" and nothing required a boundary after it. Measured on production
# 2026-08-08: this rule was the SOLE evidence for 189 packagist and 68 pypi malware
# mints, on lines like `throw new \InvalidArgumentException('Invalid ip address');`
# and `'Argument "%s" is invalid. Must enter a string (valid ip address).'` — input
# validation messages, in packages that validate IP addresses for a living.
# `\bip\s+addr\b` keeps the iproute2 command (`ip addr`, `ip addr show`) while
# rejecting the prose, and the explicit `ip address <subcommand>` alternative keeps
# the long form of the real command, which the boundary alone would have dropped.
# The 2026-10 audit (344 of 787 withdrawn lines still firing): bare `lspci`/`dmidecode` matched
# `depends=('dmidecode')`, `optdepends=('pciutils: ... lspci')` and tool-name lists, and `ip addr`
# matched `ip addr add 10.99.99.1/24 dev dummy0` (configuration, not recon), `errors.New("ip addr
# wasn't found")` and "addr:{ip addr. of client}". lspci and dmidecode now need a flag, a pipe or
# a 2> redirect after them (not `command -v lspci >/dev/null`); `ip addr` is the read form only
# (bare at the end of the command, or `show`/`list`; the long `ip address` form needs show or
# list); add/del/flush are dropped. The command quoted in a print/log/error string, or run through
# `adb shell` on a phone, is suppressed (suppressPrintedRecon). Replay: withdrawn 344 -> 211;
# verified-malware lines 14 -> 14. Most of what is left is `uname -a` run by a remote-exec or SDK
# tool, which the line alone cannot tell from recon.
pattern = '(\buname\s+-a|\bcat\s+/proc/cpuinfo|\blspci\s*(?:-|\||2>)|\bip\s+(?:-[46]\s+)?(?:addr(?:ess)?\s+(?:show|list)\b|addr\s*(?:$|["\x27`|;)&]))|\bhostname\s+-[fI]|\bcat\s+/etc/machine-id|\bdmidecode\s*(?:-|\||2>))'
points = 40
description = "System information gathering (reconnaissance)"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

