[[pkgbuild_analysis]]
id = "P-GPG-ACCESS"
# Same shape as P-SSH-ACCESS: the 2026-10 audit found 30 of 31 withdrawn lines firing on deny-lists
# (`"~/.gnupg/**": "deny"`), `helm package --keyring ~/.gnupg/secring.gpg` docs and `touch
# ~/.gnupg/common.conf`. The keyring now has to be read, copied or sent on the same line. Replay:
# withdrawn 30 -> 2; the one verified-malware line, `[]byte("~/.gnupg/")` in a path list, is lost.
pattern = '(?:\b(?:cat|head|tail|less|more|cp|scp|rsync|tar|zip|base64|xxd|od|strings|curl|wget|nc|read)\s[^|;&<>\n]{0,60}?|<\s*|\b(?:open|fopen|io\.open|ReadFile|readFile|readFileSync|read_to_string|file_get_contents|readfile|File\.(?:read|open|readlines|new)|IO\.read|File::open|fs::read|os\.Open|FileReader)\s*\(\s*(?:[\w.]+\s*\(\s*)?[rbf]?)["\x27`]?(?:~|/home/[^/\s\x27"]+)/\.gnupg/'
points = 65
description = "Accessing GPG keyring"
override_gate = false

