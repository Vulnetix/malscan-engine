[[pkgbuild_analysis]]
id = "P-CRYPTO-WALLET"
# The Bitcoin branch used the base58 charset, which includes every hex digit, so
# it matched any SHA-256 that happened to start with "bc1" -- and "#sha256=" ends
# in a non-word character, so \b was satisfied. A PyPI simple index lists one
# hash per file, so roughly 1 in 4096 files tripped it: rich, numpy, setuptools,
# boto3, cryptography and pillow were all 423'd as malware on that basis alone.
# bech32 excludes b/i/o/1 and is lowercase, which no hex string can satisfy for
# 39+ characters. All three branches are now bounded at both ends so an address
# must stand alone rather than surface inside a longer token.
pattern = '(\b4[0-9AB][1-9A-HJ-NP-Za-km-z]{93}\b|\bbc1[02-9ac-hj-np-z]{39,59}\b|\b0x[0-9a-fA-F]{40}\b)'
points = 75
hook_only = true
description = "Cryptocurrency wallet address (Monero/Bitcoin/Ethereum)"
override_gate = false

