[[pkgbuild_analysis]]
id = "P-CRON-CREATE"
# The crontab command, not the word. The 2026-10 audit replayed 644 withdrawn lines and 263 fired:
# `crontab string` parameters, "crontab entries" prose, tool-name lists (`"crontab", "at"`),
# `"../../etc/cron.d/evil"` traversal vectors, `'default' => '/etc/cron.d/x'` config and a go.mod
# `github.com/mileusna/crontab v1.2.0` line. The rule now needs one of: a pipe into crontab;
# `crontab [-u user]` with `-` (stdin), `-r`, `-l`, `< file` or a file path; an argv list
# `["crontab", "-"|"-l"|path|var]`; cat/ls/grep of a cron path (the read half of a
# read-modify-write, and cron recon); a `>`/`>>`/`tee` redirect, cp/mv/install/ln, a write call or
# a w/a-mode open() into /etc/cron* or /var/spool/cron. Replay: withdrawn 263 -> 63;
# verified-malware lines 9 -> 6 (the 3 lost are a path-list element and a `--cron` CLI example).
pattern = '[\s)]\|\s*(?:sudo\s+)?crontab(?:\s|$|["\x27`])|(?:^|[^\w./-])crontab\s+(?:-u\s+\S+\s+)?(?:-(?:[^\w\s]|$)|-\s*["\x27`)|;&]|-[rl]\b|<|[/.~$][\w$~{}./-]+|[\w-]+\.(?:txt|cron|tab|tmp|conf)\b)|["\x27]crontab["\x27]\s*,\s*(?:["\x27]-u["\x27]\s*,\s*[^,]+,\s*)?["\x27](?:-|-[rl]|[^"\x27\s]*[/.$][^"\x27]*)["\x27]|["\x27]crontab["\x27]\s*,\s*[A-Za-z_][\w.]*\s*[\]),]|\b(?:cat|ls|head|tail|less|grep)\s[^|;&\n]{0,40}?/(?:etc/cron|var/spool/cron)|(?:(?:^|[^=-])>>?|\btee(?:\s+-a)?)\s*["\x27]?/(?:etc/cron(?:\.d/|tab\b|\.(?:hourly|daily|weekly|monthly)/)|var/spool/cron)|\b(?:cp|mv|install|ln)\s[^|;&\n]{0,200}?/(?:etc/cron|var/spool/cron)|\b(?:WriteFile|writeFile|writeFileSync|appendFile|appendFileSync|write_text|file_put_contents|write_file)\s*\(\s*["\x27`]?/(?:etc/cron|var/spool/cron)|\bopen\s*\(\s*["\x27]/(?:etc/cron|var/spool/cron)[^"\x27]*["\x27]\s*,\s*["\x27]?[wa]'
points = 45
description = "Creating cron job (persistence)"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

