[[install_script_analysis]]
id = "P-NUGET-MSBUILD-ENV-EGRESS"
# An MSBuild <Exec> in a package's build/ targets that dumps the environment and sends it over the
# network. It runs in every consuming project's build, CI included, so it is CI secret theft. The
# Atom.* 1.0.0 packages (GCVE-110-NUGET-2026-000184 to -000188, confirmed in the 2026-10-25 audit)
