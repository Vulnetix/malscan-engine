pattern = '(?:>>?|\btee(?:\s+-a)?)\s*["\x27]?/etc/sudoers|\b(?:cp|mv|install|ln|rm|sed\s+-i|rsync)\s[^|;&\n]{0,200}?/etc/sudoers|\b(?:WriteFile|writeFile|writeFileSync|appendFile|appendFileSync|write_text|file_put_contents)\s*\(\s*["\x27`]?/etc/sudoers|\bopen\s*\(\s*["\x27]/etc/sudoers[^"\x27]*["\x27]\s*,\s*["\x27]?[wa]'
points = 75
description = "Sudoers file access/modification"
