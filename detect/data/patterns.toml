[[pkgbuild_analysis]]
id = "P-UAC-BYPASS"
# The ms-settings registry hijack (HKCU\Software\Classes\ms-settings\Shell\Open\command plus
# DelegateExecute, then fodhelper.exe) and the other auto-elevating binaries: a UAC bypass. The npm
# hook file of metrics-probe-9b4c (GCVE-110-NPM-2026-033137, missed and confirmed in the 2026-10-25
# audit) uses it to reach SYSTEM before uploading LSA and Credential Manager secrets. hook_only:
# security tools and detectors name the key in library code.
pattern = '(?i)ms-settings\\+shell\\+open\\+command|\\(fodhelper|computerdefaults|sdclt)\.exe\b'
points = 75
description = "Windows UAC bypass (ms-settings registry hijack or an auto-elevating binary)"
override_gate = false
hook_only = true

