[[pkgbuild_analysis]]
id = "P-MKFIFO"
# A named pipe is ordinary IPC: `t.Skipf("mkfifo unsupported")`, `.expect("mkfifo failed")`,
# `mkfifo "$stdout_pipe" "$stderr_pipe"`, and `\s` also joined "mkfifo" to the next line. The
# 2026-10 audit found all 131 withdrawn lines firing. The rule now needs the reverse-shell shape on
# one line: mkfifo followed within 200 characters by nc/ncat/netcat/telnet/socat, `openssl
# s_client`, /dev/tcp or an interactive `sh -i`, or the `rm /tmp/f; mkfifo /tmp/f` one-liner
# prefix. Replay: withdrawn 131 -> 5 (all reverse-shell test vectors); verified-malware lines
# 9 -> 8 (the one lost is help text: "tries mkfifo first, falls back to bash").
pattern = '\bmkfifo[ \t]+[^\n]{0,200}?(?:\b(?:nc|ncat|netcat|telnet|socat)\b|openssl[ \t]+s_client|/dev/tcp/|\b(?:ba)?sh[ \t]+-i\b)|\brm[ \t]+(?:-f[ \t]+)?/tmp/\S+[ \t]*;[ \t]*mkfifo[ \t]+/tmp/'
points = 55
description = "Named pipe creation (possible reverse shell component)"
override_gate = false

