[[pkgbuild_analysis]]
id = "P-PASSWD-READ"
# hook_only: outside an install hook the path is a string in a path-traversal test, a
# docstring, a sandbox deny-list or a detector's own pattern table. Rescan of 10 withdrawn
# mints: every matched line was one of those (`os.path.join(dest, "/etc/passwd")`,
# `check_url("file:///etc/passwd")`, `("/etc/shadow", "data_leakage", 0.30)`). 5 of 1,200
# pypi packages carrying it are OpenSSF-confirmed, all with other evidence.
# The path alone is not a read. The 2026-10 audit replayed 2,482 withdrawn lines and 2,392 still
# fired on the bare path: `"../../etc/passwd"` traversal vectors, `file:///etc/passwd` URL-validator
# tests, deny-lists and prose. The rule now needs a read of the literal path on the same line: a
# reading command (`cat`, `cut`, `grep`, `cp`, `base64`, ... or `< /etc/passwd`) or a file-open
# call (`open(`, `os.ReadFile(`, `readFileSync(`, `file_get_contents(`, ...); a test assertion
# line is suppressed. Replay: withdrawn
# 2,392 -> 168. Verified-malware lines 55 -> 9; the 46 lost are payload lists, docs and
# detector regexes in offensive tools kept under the hack-tool policy, not a read by the package.
pattern = '(?:\b(?:cat|head|tail|less|more|cut|awk|grep|egrep|sed|sort|cp|scp|base64|xxd|strings|od|nl|tac)\s[^|;&<>\n]{0,40}?|<\s*|\b(?:open|fopen|io\.open|ReadFile|readFile|readFileSync|read_to_string|file_get_contents|readfile|file|[Gg]et-[Cc]ontent|File\.(?:read|open|readlines|foreach|new)|IO\.(?:read|readlines|foreach)|File::open|fs::read|os\.Open|FileReader|FileInputStream)\s*\(\s*[rbf]?)["\x27`]?/etc/(?:passwd|shadow)\b'
points = 60
description = "Reading system password files"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

