# ---------------------------------------------------------------------------
# Go module rules. .go sources → pkgbuild_analysis; go.mod → install_script.
# Go runs no install scripts, so detection targets in-package exec/obfuscation.
# ---------------------------------------------------------------------------

[[pkgbuild_analysis]]
id = "GO-EXEC-SHELL"
file_exts = [".go"]
# The command must be built (a variable, a call, a concatenation): a single literal string is the
# author's own fixed command, and `exec.Command("bash", "-c")` with no third argument runs nothing.
# Of the 572 audited lines on withdrawn Go mints, 152 were literal or argument-less calls
# (`"dd if=/dev/zero ... echo hello"`, `exec.Command("bash", "-c")`).
pattern = 'exec\.Command\(\s*"(/bin/)?(ba)?sh"\s*,\s*"-c"\s*,\s*(?:[^"\s)]|"[^"\n]*"\s*\+)'
points = 55
description = "exec.Command invoking a shell with -c (arbitrary command execution)"
weakness = true
cwe = "CWE-78"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

[[pkgbuild_analysis]]
id = "GO-SYSCALL-EXEC"
file_exts = [".go"]
pattern = 'syscall\.(Exec|ForkExec)\('
# Context, not a weakness: syscall.Exec takes an argv, so nothing is parsed by a shell and there is no
# CWE-78 to report. 234 of the 239 audited lines were on withdrawn Go mints (process supervisors,
# a program re-executing itself, sandbox launchers).
points = 20
description = "syscall.Exec/ForkExec direct process replacement/spawn"

[[pkgbuild_analysis]]
id = "GO-B64-DECODE-EXEC"
file_exts = [".go"]
pattern = 'base64\.(StdEncoding|RawStdEncoding|URLEncoding)\.DecodeString[^\n]{0,200}exec\.'
points = 55
description = "base64-decoded payload passed to exec (staged execution)"
override_gate = true

[[pkgbuild_analysis]]
id = "GO-CGO-DOWNLOAD"
file_exts = [".go"]
pattern = '#cgo[^\n]{0,200}(curl|wget|https?://)'
points = 50
description = "cgo directive fetching remote code at build time"
override_gate = true

[[pkgbuild_analysis]]
id = "GO-GENERATE-CURL"
file_exts = [".go"]
pattern = '//go:generate\s[^\n]{0,200}(curl|wget)\s'
points = 45
description = "//go:generate runs curl/wget (download-and-run at generate time)"
override_gate = false

[[install_script_analysis]]
id = "GO-MOD-REPLACE-REMOTE"
file_exts = ["go.mod"]
pattern = 'replace\s[^\n]{0,120}=>\s[^\n]{0,120}(https?://|git@)'
points = 30
