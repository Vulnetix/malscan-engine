id = "P-SUDOERS-MOD"
# Writes only. The 2026-10 audit replayed 250 withdrawn lines and 241 fired on the bare path: path
# deny-lists, `re.compile(r'^/etc/sudoers')`, `grep -v '^#' /etc/sudoers` read-only probes and docs.
# The rule now needs a write on the same line: a `>`/`>>`/`tee` redirect into it, cp/mv/install/ln/
# rm/sed -i/rsync naming it, a write call, or open() with a w/a mode. A drop-in staged under $pkgdir
