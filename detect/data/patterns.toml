[[pkgbuild_analysis]]
id = "P-REVSHELL-DEVTCP"
# The bare path matched detector tables (`r"/dev/tcp/"`, `strings.Contains(cmd, "/dev/tcp/")`),
# deny-lists and loopback port probes (`exec 3<>/dev/tcp/127.0.0.1/$PORT`): the 2026-10 audit found
# 146 of 148 withdrawn lines firing. The path must now be the target of a shell fd redirect (`>&`,
# `<`, `>`, `>>`, `&>`, `3<>`) with a host after it, and a line whose every /dev/tcp host is
# loopback (127.x, localhost, 0.0.0.0, ::1) is suppressed. Replay: withdrawn 146 -> 52;
# verified-malware lines 25 -> 21 (the 4 lost are detector regexes, an assert and a 127.0.0.1
# test vector).
pattern = '(?:[<>]&?|&>|[0-9]<>)[ \t]*/dev/tcp/[^/\s]'
points = 95
description = "Bash reverse shell via /dev/tcp"
override_gate = true

