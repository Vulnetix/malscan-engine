[[pkgbuild_analysis]]
id = "P-SSH-ACCESS"
# hook_only: ssh clients, deploy tools and key managers name ~/.ssh in ordinary source (4 of
# 662 pypi packages carrying this are OpenSSF-confirmed, all with other evidence). A build or
# install hook reading it is the signal.
# Naming the directory is not reading a key. The 2026-10 audit replayed 1,017 withdrawn lines and
# 945 still fired: `~/.ssh/config` help text, `--key ~/.ssh/id_ed25519.pub` examples, sandbox
# deny-lists (`Read(~/.ssh/**)`), known_hosts docs. The rule now needs a read, copy or send of a
# private key (or the whole directory) on the same line: a reading command or `read ...` imperative,
# `< file`, or a file-open call, then id_rsa/id_dsa/id_ecdsa/id_ed25519/identity, a glob, or the
# bare directory; `.pub` is excluded. Planting a literal ssh-* key with `>> .ssh/authorized_keys`
# also counts. Replay: withdrawn 945 -> 88; verified-malware lines 19 -> 6 (the 13 lost are
# tool-path examples, docs and deny-lists inside offensive tools, not a key being read).
pattern = '(?:\b(?:cat|head|tail|less|more|cp|scp|rsync|tar|zip|base64|xxd|od|strings|curl|wget|nc|read)\s[^|;&<>\n]{0,60}?|<\s*|\b(?:open|fopen|io\.open|ReadFile|readFile|readFileSync|read_to_string|file_get_contents|readfile|File\.(?:read|open|readlines|new)|IO\.read|File::open|fs::read|os\.Open|FileReader)\s*\(\s*(?:[\w.]+\s*\(\s*)?[rbf]?)["\x27`]?(?:~|/home/[^/\s\x27"]+)/\.ssh/(?:\*|id_(?:rsa|dsa|ecdsa|ed25519)(?:_sk)?(?:[^.\w]|\.[^p]|$)|identity\b|["\x27`\s]|$)|ssh-(?:rsa|ed25519|dss|ecdsa)[^\n]{0,200}>>\s*["\x27]?(?:~|/home/[^/\s\x27"]+)/\.ssh/authorized_keys'
points = 75
description = "Accessing SSH keys"
override_gate = false
hook_only = true
hook_only_ecosystems = ["pypi", "cargo", "go", "packagist", "pubdev", "pub"]

