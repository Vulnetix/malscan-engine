# PHP / Composer / Packagist rules. composer.json scripts → install_script;
# .php sources → pkgbuild_analysis.
# ---------------------------------------------------------------------------

[[pkgbuild_analysis]]
id = "PHP-EVAL-DECODE"
file_exts = [".php", ".phtml", ".inc", ".module"]
pattern = 'eval\s*\(\s*(base64_decode|gzinflate|gzuncompress|str_rot13)\s*\('
points = 55
description = "PHP eval() of a base64/gzip/rot13-decoded payload (obfuscated code execution)"
override_gate = true

[[pkgbuild_analysis]]
id = "PHP-ASSERT-VAR"
file_exts = [".php", ".phtml", ".inc", ".module"]
# Same unanchored-tail problem as PHP-SHELL-EXEC-VAR: without the leading class this
# matched $validator->assert($value) and Check::assert($x), ordinary application and
# test code. It carried 665 packagist mints on its own. PHPUnit's assertEquals /
# assertSame are unaffected either way — a character follows "assert" before the
# paren, so they never matched.
pattern = '(^|[^A-Za-z0-9_>:$])assert\s*\(\s*\$'
points = 45
description = "PHP assert() on a variable used as a dynamic code-execution sink"
override_gate = false
# A weakness (CWE-95), not evidence: before PHP 8 assert($string) evaluated the string as code, which is a
# real code-injection sink when the string is attacker-influenced, and a plain bug otherwise. 57 live
# packagist advisories rested on this alone.
weakness = true
cwe = "CWE-95"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

[[pkgbuild_analysis]]
id = "PHP-CREATE-FUNCTION"
file_exts = [".php", ".phtml", ".inc", ".module"]
pattern = 'create_function\s*\(\s*[^,]*,\s*\$'
points = 45
description = "PHP create_function() dynamic code construction (eval backdoor vector)"
override_gate = false
# A weakness (CWE-95), not evidence: create_function() is eval() in a trench coat (removed in PHP 8) and
# old libraries use it with a code string built from a variable. 23 live packagist advisories rested on it.
weakness = true
cwe = "CWE-95"
cvss = "CVSS:3.1/AV:L/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L"

[[pkgbuild_analysis]]
id = "PHP-SHELL-EXEC-VAR"
file_exts = [".php", ".phtml", ".inc", ".module"]
# The leading class is load-bearing. Without it `exec` matched the TAIL of any
# identifier ending in exec — curl_exec($ch) and $pdo->exec($sql) are ordinary PHP
# and both fired. Measured on production 2026-08-07: this rule appeared in 10,792
# of packagist's 15,677 malware mints (69%), and sampling mints whose ONLY evidence
# was this rule returned matchedLine values like "$raw = curl_exec($ch);" and
# "$pdo->exec($sql);". RE2 has no lookbehind, so the preceding character is matched
# and excluded instead: identifier chars (curl_exec), `>` (->exec), `:` (Foo::exec)
# and `$` (a variable function name).
pattern = '(^|[^A-Za-z0-9_>:$])(system|exec|shell_exec|passthru|proc_open|popen)\s*\(\s*\$'
points = 45
hook_only = true
description = "PHP OS command execution sink invoked on a variable"
override_gate = false

[[pkgbuild_analysis]]
id = "PHP-OBFUSCATION-CHAIN"
file_exts = [".php", ".phtml", ".inc", ".module"]
pattern = '(gzinflate|gzuncompress)\s*\(\s*(base64_decode|str_rot13)\s*\('
points = 45
description = "PHP nested gzinflate/str_rot13 obfuscation wrapping a decoded payload"
override_gate = false

[[install_script_analysis]]
id = "PHP-COMPOSER-CURL-PIPE"
file_exts = ["composer.json"]
pattern = '(curl|wget)\s[^"\n]{0,200}\|\s*(ba)?sh'
points = 55
description = "Composer lifecycle script pipes curl/wget to a shell (download-and-execute)"
override_gate = true

[[install_script_analysis]]
